name: Deploy documentation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and package the static site
        run: |
          test -f public/index.html
          (cd public && sha256sum -c SHA256SUMS)
          test -z "$(find public -type l -print -quit)"
          test -z "$(find public -type f -links +1 -print -quit)"
          tar --directory public -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, Node 24
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Upload downloadable documentation
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, Node 24
        with:
          name: documentation-site-${{ github.event.after || github.sha }}
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Surface the downloadable site
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: printf '[Download the published static documentation](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
